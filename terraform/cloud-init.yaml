#cloud-config
# Chaque nouvelle VM du groupe élastique installe nginx et affiche son nom :
# on voit ainsi le load balancer répartir les visiteurs entre les VM.
package_update: true
packages:
  - nginx
runcmd:
  - echo "<h1>Boutique - servi par $(hostname)</h1>" > /var/www/html/index.html
  - systemctl enable --now nginx
