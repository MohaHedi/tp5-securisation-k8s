# Frontend durci (nginx sans privilèges)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: boutique
  labels:
    app: frontend
  annotations:
    # Exceptions Checkov justifiées (voir NOTE_SYNTHESE.md, risques résiduels)
    checkov.io/skip1: CKV_K8S_43=Labo minikube sans registre ; en production l'image sera référencée par digest depuis Azure Container Registry
    checkov.io/skip2: CKV_K8S_15=Labo minikube sans registre ; images chargées localement, imagePullPolicy Always impossible
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: boutique-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: boutique-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /sante
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /sante
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: boutique
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: http
