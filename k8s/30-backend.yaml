# Backend durci (Deployment + Service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: boutique
  labels:
    app: backend
  annotations:
    # Exceptions Checkov justifiées (voir NOTE_SYNTHESE.md, risques résiduels)
    checkov.io/skip1: CKV_K8S_43=Labo minikube sans registre ; en production l'image sera référencée par digest depuis Azure Container Registry
    checkov.io/skip2: CKV_K8S_15=Labo minikube sans registre ; images chargées localement, imagePullPolicy Always impossible
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: boutique-app
      automountServiceAccountToken: false     # le Pod n'a pas besoin de parler à l'API Kubernetes
      securityContext:
        runAsNonRoot: true                    # interdit root
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault                # filtre les appels système dangereux
      containers:
        - name: backend
          image: boutique-backend:1.0.0       # version figée, jamais "latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: database
            - name: DB_USER
              value: boutique
            - name: DB_PASSWORD_FILE
              value: /var/run/secrets/db/password
          securityContext:
            allowPrivilegeEscalation: false   # pas d'élévation de privilèges (sudo, setuid)
            readOnlyRootFilesystem: true      # un pirate ne peut pas modifier le système de fichiers
            capabilities:
              drop: ["ALL"]                   # aucun "super-pouvoir" Linux
          resources:                          # limite la casse en cas d'abus (et sert au HPA)
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/sante
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/pret
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: db-credentials
              mountPath: /var/run/secrets/db
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-credentials
          secret:
            secretName: db-credentials
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: boutique
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: http
