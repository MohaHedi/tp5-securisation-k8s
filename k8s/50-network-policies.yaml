# Network Policies : "tout est fermé, sauf ce qui est autorisé"
#
#   Internet ──► frontend :8080 ──► backend :8080 ──► database :5432
#
# ⚠ Ces règles ne fonctionnent QUE si le plugin réseau (CNI) les applique.
#   Calico : oui. Le réseau par défaut de minikube : NON (les règles sont ignorées sans erreur).
---
# 1. Par défaut : rien n'entre, rien ne sort
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: boutique
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. Tous les Pods peuvent interroger le DNS du cluster (sinon "database" n'est plus résolu)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: boutique
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Le frontend reçoit le trafic des visiteurs sur le port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-entree
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# 4. frontend → backend sur le port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-vers-backend
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-depuis-frontend
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
---
# 5. backend → database sur le port 5432 (la règle demandée par le TP)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-vers-database
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: database
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-depuis-backend
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
